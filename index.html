<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>স্মার্ট আয়কর ক্যালকুলেটর — বাংলাদেশ</title>
<meta name="description" content="বাংলাদেশের ব্যক্তি করদাতাদের জন্য আয়কর ক্যালকুলেটর: সর্বশেষ করমুক্ত আয়সীমা, স্ল্যাব-ভিত্তিক কর, বিনিয়োগ রেয়াত, মাসিক কর্তন ও সম্পূর্ণ নিয়ম-গাইড। Bangladesh income tax calculator in Bangla and English." />
<meta name="theme-color" content="#0a6e4f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div>
        <h1 data-i18n="appTitle">স্মার্ট আয়কর ক্যালকুলেটর</h1>
        <p id="brandSub"></p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="calc" aria-selected="true" data-i18n="tabCalc"></button>
      <button class="tab" role="tab" data-view="guide" aria-selected="false" data-i18n="tabGuide"></button>
      <button class="tab" role="tab" data-view="settings" aria-selected="false" data-i18n="tabSettings"></button>
    </nav>
    <div class="tools">
      <button class="btn ghost" id="langBtn" type="button" data-i18n="langSwitch"></button>
      <button class="btn ghost icon-btn" id="themeBtn" type="button">🌓</button>
      <button class="btn ghost icon-btn" id="printBtn" type="button" data-i18n-title="printBtn">🖨️</button>
    </div>
  </div>
</header>

<main>
  <!-- ================= CALCULATOR ================= -->
  <section class="view" id="view-calc" role="tabpanel">
    <div class="grid">
      <div class="inputs-col">

        <div class="card">
          <h2><span class="step" data-num="1"></span> <span data-i18n="s1"></span></h2>
          <div class="field">
            <label for="presetId" data-i18n="yearField"></label>
            <select id="presetId"></select>
            <div class="hint" id="presetHint"></div>
          </div>
          <div class="field">
            <label for="category" data-i18n="categoryField"></label>
            <select id="category"></select>
            <div class="hint" id="categoryHint"></div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="area" data-i18n="areaField"></label>
              <select id="area"></select>
            </div>
            <div class="field">
              <label for="disabledChildren" data-i18n="childField"></label>
              <input id="disabledChildren" type="number" min="0" step="1" inputmode="numeric" />
              <div class="hint" data-i18n="childHint"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2><span class="step" data-num="2"></span> <span data-i18n="s2"></span></h2>
          <div class="field">
            <label for="grossBefore" data-i18n="grossBefore"></label>
            <div class="money"><input id="grossBefore" type="number" min="0" step="100" inputmode="decimal" /></div>
            <div class="hint" data-words="grossBefore"></div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="incrementMonth" data-i18n="incrementMonth"></label>
              <select id="incrementMonth"></select>
            </div>
            <div class="field" id="grossAfterField">
              <label for="grossAfter" data-i18n="grossAfter"></label>
              <div class="money"><input id="grossAfter" type="number" min="0" step="100" inputmode="decimal" /></div>
              <div class="hint" data-words="grossAfter"></div>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="festivalBonus" data-i18n="festivalBonus"></label>
              <div class="money"><input id="festivalBonus" type="number" min="0" step="100" inputmode="decimal" /></div>
            </div>
            <div class="field">
              <label for="festivalBonusMonth" data-i18n="whichMonth"></label>
              <select id="festivalBonusMonth"></select>
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label for="otherBonus" data-i18n="otherBonus"></label>
              <div class="money"><input id="otherBonus" type="number" min="0" step="100" inputmode="decimal" /></div>
            </div>
            <div class="field">
              <label for="otherBonusMonth" data-i18n="whichMonth"></label>
              <select id="otherBonusMonth"></select>
            </div>
          </div>
        </div>

        <div class="card">
          <h2><span class="step" data-num="3"></span> <span data-i18n="s3"></span></h2>
          <div class="field">
            <span class="label" data-i18n="pfBaseQ"></span>
            <div class="seg" id="pfBaseSeg" role="group">
              <button type="button" data-val="gross" data-i18n="pfGross"></button>
              <button type="button" data-val="basic" data-i18n="pfBasic"></button>
            </div>
          </div>
          <div class="field" id="basicPctField">
            <label for="basicPct" data-i18n="basicPct"></label>
            <input id="basicPct" type="number" min="0" max="100" step="1" />
          </div>
          <div class="row2">
            <div class="field">
              <label for="employeePfPct" data-i18n="employeePf"></label>
              <input id="employeePfPct" type="number" min="0" max="100" step="0.5" />
            </div>
            <div class="field">
              <label for="employerPfPct" data-i18n="employerPf"></label>
              <input id="employerPfPct" type="number" min="0" max="100" step="0.5" />
            </div>
          </div>
          <label class="check"><input type="checkbox" id="pfCountsAsInvestment" /> <span><span data-i18n="pfInvest"></span> <span class="sub" data-i18n="pfInvestSub"></span></span></label>
        </div>

        <div class="card">
          <h2><span class="step" data-num="4"></span> <span data-i18n="s4"></span></h2>
          <p class="sub" style="margin:-6px 0 12px" data-i18n="s4sub"></p>
          <div id="investFields"></div>
        </div>

        <div class="card">
          <h2><span class="step" data-num="5"></span> <span data-i18n="s5"></span></h2>
          <div class="field">
            <label for="otherIncome" data-i18n="otherIncome"></label>
            <div class="money"><input id="otherIncome" type="number" min="0" step="100" inputmode="decimal" /></div>
            <div class="hint" data-i18n="otherIncomeHint"></div>
          </div>
          <div class="field">
            <label for="taxPaid" data-i18n="taxPaid"></label>
            <div class="money"><input id="taxPaid" type="number" min="0" step="100" inputmode="decimal" /></div>
            <div class="hint" data-i18n="taxPaidHint"></div>
          </div>
        </div>

        <div class="card no-print">
          <div class="card-head">
            <h2 data-i18n="saved"></h2>
            <button class="btn sm" id="saveScenario" type="button" data-i18n="saveScenario"></button>
          </div>
          <div id="historyList" class="sub"></div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn ghost sm" id="resetInputs" type="button" data-i18n="resetInputs"></button>
            <button class="btn danger sm" id="clearHistory" type="button" data-i18n="clearHistory"></button>
          </div>
        </div>
      </div>

      <div class="results-col">
        <div class="hero" id="hero"></div>

        <div class="card">
          <div class="card-head">
            <h2 data-i18n="flowTitle"></h2>
            <span class="badge green" id="ruleBadge"></span>
          </div>
          <ul class="flow" id="flow"></ul>
          <div id="flowNotes"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div>
              <h2 data-i18n="slabTitle"></h2>
              <p class="sub" data-i18n="slabSub"></p>
            </div>
          </div>
          <div class="bandbar" id="bandbar"></div>
          <div class="legend" id="bandLegend"></div>
          <div class="table-wrap" style="margin-top:12px">
            <table id="slabTable">
              <thead><tr><th data-i18n="thBand"></th><th class="r" data-i18n="thRate"></th><th class="r" data-i18n="thInBand"></th><th class="r" data-i18n="thTax"></th></tr></thead>
              <tbody></tbody>
              <tfoot></tfoot>
            </table>
          </div>
        </div>

        <div class="card">
          <h2 data-i18n="rebateTitle"></h2>
          <div id="rebateBox"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div>
              <h2 data-i18n="monthTitle"></h2>
              <p class="sub" data-i18n="monthSub"></p>
            </div>
            <button class="btn ghost sm no-print" id="exportCsv" type="button">⬇️ CSV</button>
          </div>
          <div class="table-wrap">
            <table id="monthTable">
              <thead><tr><th data-i18n="thMonth"></th><th class="r" data-i18n="thSalary"></th><th class="r" data-i18n="thBonus"></th><th class="r" data-i18n="thPfYou"></th><th class="r" data-i18n="thPfEmp"></th><th class="r" data-i18n="thTax"></th><th class="r" data-i18n="thNet"></th></tr></thead>
              <tbody></tbody>
              <tfoot></tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= GUIDE ================= -->
  <section class="view" id="view-guide" role="tabpanel" hidden>
    <div class="guide" id="guideRoot"></div>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section class="view" id="view-settings" role="tabpanel" hidden>
    <div class="guide" id="settingsRoot"></div>
  </section>
</main>

<footer>
  <p data-i18n="footer1"></p>
  <p id="footer2"></p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/tax-rules.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
